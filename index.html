<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hear attoton — Chimera timing fix</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 50% 0%, #1c2430, #0b0d10); color: #e8eef5; }
    main { width: min(36rem, 92vw); text-align: center; }
    h1 { font-size: 1.75rem; font-weight: 650; margin: 0 0 .35rem; letter-spacing: .02em; }
    p { opacity: .85; margin: 0 0 1.1rem; line-height: 1.45; }
    code { font-size: 1.05rem; }
    audio { width: 100%; margin-top: .35rem; }
    button { margin-top: 1rem; font: inherit; font-weight: 600; padding: .75rem 1.35rem;
      border-radius: .65rem; border: 0; background: #d9e2ec; color: #102a43; cursor: pointer; }
    button:hover { filter: brightness(1.06); }
    .hint { margin-top: 1.1rem; font-size: .9rem; opacity: .65; }
  </style>
</head>
<body>
  <main>
    <h1>attoton</h1>
    <p><code>ˈæt.ʌˌtʰɔn</code> — middle <code>ʌ</code> should be audible (Chimera timing fix)</p>
    <audio id="a" controls preload="auto" src="./attoton.wav"></audio>
    <div><button id="play" type="button">Play attoton</button></div>
    <p class="hint">Open this page in your browser, then click Play. Sound plays on your device — no Try Live needed.</p>
  </main>
  <script>
    const a = document.getElementById('a');
    document.getElementById('play').onclick = async () => {
      try { a.currentTime = 0; await a.play(); } catch (e) { alert(String(e)); }
    };
  </script>
</body>
</html>
